name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать проект
        run: |
          unzip -q project.zip -d work
          ls -la work

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Собрать движок llama-server для Android (arm64)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK"
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cd llama.cpp
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DCMAKE_C_FLAGS="-march=armv8.2-a+dotprod" \
            -DCMAKE_CXX_FLAGS="-march=armv8.2-a+dotprod"
          cmake --build build --config Release --target llama-server -j"$(nproc)"
          ls -la build/bin

      - name: Положить движок в приложение
        run: |
          mkdir -p work/app/src/main/jniLibs/arm64-v8a
          cp llama.cpp/build/bin/llama-server work/app/src/main/jniLibs/arm64-v8a/libllamaserver.so
          ls -la work/app/src/main/jniLibs/arm64-v8a

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Собрать APK
        working-directory: work
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: local-ai-apk
          path: work/app/build/outputs/apk/debug/*.apk
